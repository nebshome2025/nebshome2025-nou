<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Testul Nebshome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="testForm" class="card">
        <h2>Răspunde la toate întrebările:</h2>
        <div id="questions"></div>
       <label for="userEmail" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #333;">Unde îți trimitem profilul și locuința ideală?</label>
<input type="email" id="userEmail" required placeholder="nume@exemplu.com" style="width:100%; padding:10px; margin:10px 0; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit" class="btn">Vezi rezultatul</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
