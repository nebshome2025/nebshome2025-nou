<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Testul Nebshome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="testForm" class="card">
        <h2>Răspunde la toate întrebările:</h2>
        <div id="questions"></div>
      <input type="email" id="userEmail" required placeholder="Introduceți adresa unde primiți profilul" style="width:100%; padding:10px; margin:5px 0 10px 0; border: 1px solid #ccc; border-radius: 4px;">

<input type="tel" id="userPhone" required placeholder="Număr de telefon (pentru WhatsApp)" style="width:100%; padding:10px; margin:5px 0 10px 0; border: 1px solid #ccc; border-radius: 4px;">
        <button type="submit" class="btn">Vezi rezultatul</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
