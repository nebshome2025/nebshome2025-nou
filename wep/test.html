<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Testul Nebshome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="testForm" class="card">
        <h2>Răspunde la toate întrebările:</h2>
        <div id="questions"></div>
      <input type="email" id="userEmail" required placeholder="Introduceți adresa unde primiți profilul" style="width:100%; padding:10px; margin:5px 0 10px 0; border: 1px solid #ccc; border-radius: 4px;">

<input type="tel" id="userPhone" required placeholder="Număr de telefon (pentru WhatsApp)" style="width:100%; padding:10px; margin:5px 0 10px 0; border: 1px solid #ccc; border-radius: 4px;">
        <div style="margin: 15px 0; font-size: 14px; text-align: left; display: flex; align-items: flex-start;">
    <input type="checkbox" id="gdprConsent" required style="margin-top: 3px; margin-right: 10px;">
    <label for="gdprConsent">
        Sunt de acord cu prelucrarea datelor mele (email, telefon) pentru primirea rezultatului, conform <a href="politica-confidentialitate.html" target="_blank">Politicii de Confidențialitate</a> și accept <a href="termeni.html" target="_blank">Termenii și Condițiile</a>.
    </label>
</div>
        <button type="submit" class="btn">Vezi rezultatul</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
